# Jenkins Configuration as Code. Secrets come from the environment (see .env.example), never from this file.
jenkins:
  systemMessage: "devsecops-ci-pipeline: Jenkins mirror of the GitHub Actions workflow"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: "http://localhost:${JENKINS_HOST_PORT:-8085}/"

jobs:
  - script: >
      pipelineJob('devsecops-ci-pipeline') {
        description('Mirror of .github/workflows/devsecops-pipeline.yml')
        // Declared here too so the job is parameterized on a fresh Jenkins (the Jenkinsfile declares it as well).
        parameters {
          booleanParam('FORCE_STAGING', false, 'Run the (placeholder) staging deploy and policy gate even when not on main')
        }
        definition {
          cpsScm {
            scm {
              git {
                remote { url('${JENKINS_REPO_URL}') }
                branch('${JENKINS_REPO_BRANCH}')
              }
            }
            scriptPath('Jenkinsfile')
          }
        }
      }
