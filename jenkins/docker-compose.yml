# Run:  cp .env.example .env   (then set a password)   docker compose up -d --build
services:
  jenkins:
    build: .
    container_name: jenkins-devsecops
    # root + the Docker socket is host-root-equivalent. Fine for a throwaway local demo, NOT for a shared server.
    # See "Security trade-offs" in README.md.
    user: root
    ports:
      - "${JENKINS_HOST_PORT:-8085}:8080"   # 8085 so it does not clash with other local tools on 8080
    environment:
      - JENKINS_ADMIN_ID
      - JENKINS_ADMIN_PASSWORD
      - JENKINS_REPO_URL
      - JENKINS_REPO_BRANCH
      - JENKINS_HOST_PORT
      - NVD_API_KEY   # optional: a free NVD API key lets Dependency-Check download its database
      # Jenkins refuses to check out a local folder unless this is true. Only turn it on for the local-repo mode.
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=${JENKINS_ALLOW_LOCAL_CHECKOUT:-false}
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      # Optional: read the repository from a local folder instead of GitHub (set JENKINS_REPO_URL=file:///repo).
      - ${JENKINS_LOCAL_REPO:-./.empty}:/repo:ro
    restart: unless-stopped

volumes:
  jenkins_home:
